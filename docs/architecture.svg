<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<style>.b{fill:#fff;stroke:#c8ccd2;stroke-width:1.2;rx:8}.n{fill:#eef3ff;stroke:#2457d6}.s{fill:#f4f5f7}.t{font-weight:600}.m{fill:#666;font-size:11.5px}.l{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}.d{stroke-dasharray:5 4}</style>
<rect width="900" height="470" fill="#fafbfc"/>
<rect class="b s" x="20" y="20" width="170" height="70"/><text class="t" x="34" y="46">Web UI (static/js)</text><text class="m" x="34" y="64">instruction · URL · timeline</text><text class="m" x="34" y="79">pause panel · downloads</text>
<rect class="b s" x="250" y="20" width="190" height="70"/><text class="t" x="264" y="46">Flask API (app.py)</text><text class="m" x="264" y="64">/api/plan · /api/runs · /respond</text><text class="m" x="264" y="79">reports · screenshots · /demo/*</text>
<rect class="b s" x="500" y="20" width="170" height="70"/><text class="t" x="514" y="46">agent.py</text><text class="m" x="514" y="64">background threads</text><text class="m" x="514" y="79">start · respond · cancel</text>
<rect class="b s" x="720" y="20" width="160" height="70"/><text class="t" x="734" y="46">SQLite (store.py)</text><text class="m" x="734" y="64">runs · steps · report</text>
<path class="l" d="M190 55H250"/><path class="l" d="M440 55H500"/><path class="l" d="M670 55H720"/>
<rect class="b" x="20" y="130" width="860" height="250" style="fill:#fff"/><text class="t" x="34" y="152">LangGraph workflow (workflow.py) — state: cursor · attempts · asks · pending · error</text>
<rect class="b n" x="40" y="175" width="110" height="52"/><text class="t" x="58" y="198">plan</text><text class="m" x="58" y="215">rules or LLM</text>
<rect class="b n" x="190" y="175" width="110" height="52"/><text class="t" x="208" y="198">observe</text><text class="m" x="208" y="215">DOM · blockers</text>
<rect class="b n" x="340" y="175" width="110" height="52"/><text class="t" x="358" y="198">act</text><text class="m" x="358" y="215">skills.py (whitelist)</text>
<rect class="b n" x="490" y="175" width="110" height="52"/><text class="t" x="508" y="198">verify</text><text class="m" x="508" y="215">read-back · evidence</text>
<rect class="b n" x="640" y="175" width="110" height="52"/><text class="t" x="658" y="198">report</text><text class="m" x="658" y="215">outcome from steps</text>
<path class="l" d="M150 201H190"/><path class="l" d="M300 201H340"/><path class="l" d="M450 201H490"/><path class="l" d="M600 201H640"/>
<rect class="b" x="340" y="290" width="110" height="52" style="fill:#fff7e6;stroke:#a66a00"/><text class="t" x="358" y="313">recover</text><text class="m" x="358" y="330">scroll · reload</text>
<rect class="b" x="190" y="290" width="110" height="52" style="fill:#f3efff;stroke:#6b46c1"/><text class="t" x="208" y="313">wait_user</text><text class="m" x="208" y="330">confirm / input</text>
<path class="l d" d="M395 227V290"/><path class="l d" d="M350 227L290 292"/><path class="l d" d="M245 290V227"/><path class="l d" d="M340 306Q300 270 275 229"/>

<text class="m" x="490" y="305">act fails → recover → observe (bounded retries, else FAILED)</text><text class="m" x="490" y="323">act needs a human → wait_user → observe (never bypass)</text>
<text class="m" x="490" y="262">verify passes → next step: back to observe</text>
<rect class="b s" x="20" y="400" width="250" height="56"/><text class="t" x="34" y="422">executor.py · runtime.py</text><text class="m" x="34" y="440">Chromium · limits · pauses</text>
<rect class="b s" x="300" y="400" width="280" height="56"/><text class="t" x="314" y="422">observer.py · skills.py · policy.py</text><text class="m" x="314" y="440">element scoring · generic skills · safety policy</text>
<rect class="b s" x="610" y="400" width="270" height="56"/><text class="t" x="624" y="422">Real sites  /  local /demo pages</text><text class="m" x="624" y="440">/demo = regression only</text>
</svg>
